<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./index.js" type="module" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <style>
      body {
        font-family: "Hanken Grotesk", sans-serif;
      }
    </style>
    <title>Results summary component</title>
  </head>
  <body class="flex justify-center w-full h-screen">
    <div class="flex flex-col items-center text-center w-full gap-6">
      <div
        class="flex flex-col items-center gap-6 bg-gradient-to-b from-[#7755FF] to-[#2F2CE9] rounded-b-[32px] w-full py-8 px-14"
      >
        <p class="text-[#CAC9FF] font-bold text-[18px] leading-[130%]">
          Your Result
        </p>
        <div
          class="flex flex-col items-center justify-center bg-gradient-to-b from-[#4D21C9] to-transparent rounded-full w-36 h-36"
        >
          <p id="score" class="text-white text-[56px] font-extrabold"></p>
          <p class="text-sm text-[#CAC9FF] font-bold">of 100</p>
        </div>
        <div>
          <h1 class="text-white text-2xl font-bold leading-[130%]">Great</h1>
          <p class="text-[#CAC9FF] leading-[130%]">
            You scored higher than 65% of the people who have taken these tests.
          </p>
        </div>
      </div>
      <div class="w-full px-[15px] flex flex-col items-center gap-6">
        <h2 class="self-start text-lg font-bold text-[#303B59] leading-[130%]">
          Summary
        </h2>
        <ul class="flex flex-col gap-4 w-full">
          <li class="h-14 bg-[#FFF6F6] flex justify-between p-4 rounded-xl">
            <div class="flex gap-4">
              <img src="./assets/images/icon-reaction.svg" alt="Reaction" />
              <h3 class="text-[#FF5555] font-medium leading-[130%]">
                Reaction
              </h3>
            </div>

            <p class="text-[#303B59] font-bold leading-[130%]">
              <span id="reaction" class="opacity-100">90</span>
              <span class="opacity-50">/ 100</span>
            </p>
          </li>
          <li>
            <img src="./assets/images/icon-memory.svg" alt="Memory" />
            <h3>Memory</h3>
            <p><span id="memory"></span> / 100</p>
          </li>
          <li>
            <img src="./assets/images/icon-verbal.svg" alt="Verbal" />
            <h3>Verbal</h3>
            <p><span id="verbal"></span> / 100</p>
          </li>
          <li>
            <img src="./assets/images/icon-visual.svg" alt="Visual" />
            <h3>Visual</h3>
            <p><span id="visual"></span> / 100</p>
          </li>
        </ul>
        <button>Continue</button>
      </div>
    </div>
  </body>
</html>
